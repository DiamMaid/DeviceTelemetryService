version: '3.8'

services:
  # TimescaleDB - база данных для временных рядов
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: device-telemetry-timescaledb
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infra/init-timescaledb:/docker-entrypoint-initdb.d
    networks:
      - telemetry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user -d telemetry_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # RabbitMQ - брокер сообщений для асинхронной обработки телеметрии
  rabbitmq:
    image: rabbitmq:3-management
    container_name: device-telemetry-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: telemetry_user
      RABBITMQ_DEFAULT_PASS: telemetry_password
    ports:
      - "5672:5672"   # AMQP порт
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - telemetry-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis - кэш и хранилище для скользящих окон
  redis:
    image: redis:7-alpine
    container_name: device-telemetry-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - telemetry-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Prometheus - сбор метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: device-telemetry-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - telemetry-network
    depends_on:
      - timescaledb

  # Grafana - визуализация метрик
  grafana:
    image: grafana/grafana:latest
    container_name: device-telemetry-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - telemetry-network
    depends_on:
      - prometheus

  # Jaeger - распределенная трассировка (OpenTelemetry)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: device-telemetry-jaeger
    ports:
      - "5775:5775/udp"   # UDP port for legacy thrift
      - "6831:6831/udp"   # UDP port for jaeger.thrift
      - "6832:6832/udp"   # UDP port for jaeger.thrift
      - "5778:5778"       # HTTP port for configs
      - "16686:16686"     # Web UI
      - "14268:14268"     # HTTP port for jaeger.thrift directly
      - "14250:14250"     # gRPC port for model.proto
      - "9411:9411"       # Zipkin compatible endpoint
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    networks:
      - telemetry-network

networks:
  telemetry-network:
    driver: bridge

volumes:
  timescaledb_data:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  grafana_data:
